[package]
name = "wordsmith-ui"
description = "Desktop and web interface for Wordsmith Script"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
wordsmith-script.workspace = true
wordsmith-format.workspace = true
wordsmith-engine.workspace = true
wordsmith-doc.workspace = true
wordsmith-geom.workspace = true
wordsmith-layout.workspace = true
wordsmith-render.workspace = true
egui.workspace = true
raw-window-handle.workspace = true
serde_json.workspace = true
serde.workspace = true
log.workspace = true
# PNG files of the interface drawn offscreen (README pictures, visual checks).
image = { workspace = true, features = ["png"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-dialogs.workspace = true
# Crash-safe writes of the preferences file (M4).
craft-atomic.workspace = true

[lints]
workspace = true
