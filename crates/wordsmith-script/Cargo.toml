[package]
name = "wordsmith-script"
description = "Screenplay elements, typing rules, scenes and production data for Wordsmith Script"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
wordsmith-doc = { workspace = true }
wordsmith-engine = { workspace = true }
wordsmith-layout = { workspace = true }
wordsmith-pdf = { workspace = true }
craft-proof = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# Calendar dates (`dates`): all date and time conversion goes through chrono.
chrono = { workspace = true }

[dev-dependencies]
hayro-syntax = "0.7.2"
hayro-interpret = { version = "0.7.0", default-features = false, features = ["embed-fonts"] }
hayro-cmap = "0.1"
kurbo = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Crash-safe file writes (PDF export).
craft-atomic = { workspace = true }

[lints]
workspace = true
