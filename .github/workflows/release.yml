# Builds release bundles for macOS, Windows and Linux with `cargo xtask bundle`
# and keeps them as workflow artifacts. It publishes nothing: it runs only when
# started by hand, and making a GitHub release from the artifacts is a separate,
# deliberate step for the project owner. Not yet run: the project has no remote.
name: Bundles

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    name: bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      - name: cargo xtask ci
        run: cargo xtask ci

      - name: cargo xtask bundle
        run: cargo xtask bundle

      - name: Keep the bundle
        uses: actions/upload-artifact@v4
        with:
          name: wordsmith-script-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
