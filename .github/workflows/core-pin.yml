# How far this app's core pin is behind the newest open-source-core release. Owned by the core
# (template/.github/workflows/core-pin.yml) and kept identical in every app by `cargo xtask sync`.
#
# An app moves to the newest core before new work starts on it and before its own release (core
# decision 0011); between those it may fall behind, and CI stays green for a release the app does
# not need yet. What must not happen is that nobody notices. So once a week
# `cargo xtask core-pin --max-behind 3` counts the core releases newer than the app's pin, and
# when there are more than three an issue named "Move to open-source-core vX.Y.Z" is opened
# here, or the open one is brought up to date.
#
# This file only says when that runs. The job is the core's shared workflow, called at the tag
# `workflows-v1`, which the core moves (ci.yml in this folder says how that works):
# https://github.com/jamescjfoundation/open-source-core/blob/workflows-v1/.github/workflows/shared-core-pin.yml
#
# GitHub switches a scheduled workflow off when its repository has had no activity for 60 days,
# and tells nobody. `gh workflow list --all` shows it as `disabled_inactivity`;
# `gh workflow enable core-pin.yml`, or "Enable workflow" on the workflow's page under Actions,
# switches it back on.
#
# Core decisions: https://github.com/jamescjfoundation/open-source-core/tree/main/docs/decisions
name: Core pin

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-pin
  cancel-in-progress: false

jobs:
  behind:
    # The shared workflow's job gets this token and no more: read the code, open or edit an issue.
    permissions:
      contents: read
      issues: write
    uses: jamescjfoundation/open-source-core/.github/workflows/shared-core-pin.yml@workflows-v1
    with:
      max-behind: 3
