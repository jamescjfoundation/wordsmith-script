name: Bug report
description: Something in the app, the command line or the MCP server does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Issues are public. Do not include your name, email address, local paths or a real script.
        If you attach a file, use a small made-up script. Security problems go to the Security tab instead (see SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Version
      description: From File ▸ About, or `wordsmith-cli --version`.
      placeholder: 0.2.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: System
      options: [macOS, Windows, Linux, Web]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What you did
      description: The steps, from opening the app or running the command.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
